<!DOCTYPE html>
<html lang="en">

<head>

   <!-- =========================

    ========================== -->

    <header class="site-header">

            class="logo"
            aria-label="Go to homepage"
        >
            <img
                src="../image/Logo sito VD.png"
                alt="Viola De Donno's"

        </a>

        <a
            href="../index.html"
            class="brand"
            aria-label="Go to homepage"

            <h1>VIOLA DE DONNO'S</h1>
            <p>PORTFOLIO</p>
        </a>


        <nav class="main-navigation" aria-label="Main navigation">

            <a href="../paintings.html">
                PAINTINGS
            </a>

            <a href="../sewing-project.html">
                SEWING PROJECT
            </a>

            <a href="../contacts.html">
                CONTACTS
            </a>

        </nav>

    </header>

    <a
        href="../paintings.html"
        class="detail-close-button"
        aria-label="Torna alla galleria dei dipinti"
    >
        <span aria-hidden="true">×</span>
    </a>
    
    <!-- =========================
         CONTENUTO PRINCIPALE
    ========================== -->
    <main id="main-content" class="painting-detail-page">

        <!-- Dipinto precedente: Lei -->
        <a

                <img
                    src="../image/dipinti/I-me-mine.jpg"

            </div>


            <div class="painting-details">

                <p class="painting-label">
                    Painting
                </p>

                <div class="painting-separator"></div>

                    <div class="painting-data-row">
                        <dt>Dimensions</dt>
                        <dd>70 x 100 cm</dd>
                    </div>

                    <div class="painting-data-row">
                        <dt>Technique</dt>
                        <dd>Oil on canvas</dd>
                    </div>

                    <div class="painting-data-row">
                        <dt>Year</dt>
                        <dd>2026</dd>
                    </div>

                </dl>

            </div>

        </section>


        <!-- Dipinto successivo: Help -->
        <a
            href="painting-punto-luce.html"

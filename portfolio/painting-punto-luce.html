<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Mari, a painting by Viola De Donno created in 2024."
    >

    <title>Mari | Viola De Donno's Portfolio</title>

    <link
        rel="icon"
        type="image/png"
        href="image/Logo sito VD.png"
    >

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/painting-detail.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>


  

    <a
        href="../paintings.html"
        class="detail-close-button"
        aria-label="Torna alla galleria dei dipinti"
    >
        <span aria-hidden="true">×</span>
    </a>
    
    <!-- =========================
         CONTENUTO PRINCIPALE
    ========================== -->
    <main id="main-content" class="painting-detail-page">

        <!-- Dipinto precedente: Lei -->
        <a
            href="painting-I-me_mine.html"
            class="gallery-arrow gallery-arrow-previous"

        </a>


        <section class="painting-detail" aria-labelledby="painting-title">

            <div class="painting-image-container">

                <img
                    src="../image/dipinti/punto_luce.jpg"

                >

            </div>


            <div class="painting-details">

                <p class="painting-label">
                    Painting
                </p>

                <h1 id="painting-title">
                    PUNTO LUCE
                </h1>

                <div class="painting-separator"></div>

                <dl class="painting-data">

                    <div class="painting-data-row">
                        <dt>Dimensions</dt>
                        <dd>100 x 150 cm</dd>
                    </div>

                    <div class="painting-data-row">
                        <dt>Technique</dt>
                        <dd>Oil on canvas</dd>
                    </div>

                    <div class="painting-data-row">
                        <dt>Year</dt>
                        <dd>2026</dd>
                    </div>

                </dl>

            </div>

        </section>


        <!-- Dipinto successivo: Help -->
        <a
            href="painting-Lei.html"
            class="gallery-arrow gallery-arrow-next"
            aria-label="View next painting: Help"
        >
            <span aria-hidden="true">▶</span>
        </a>
